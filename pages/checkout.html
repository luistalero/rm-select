<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | R&M SELECT</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/store.css"></head><body><header class="site-header scrolled"><a class="brand" href="../index.html"><span class="brand__mark">R&M</span><span class="brand__name">SELECT</span></a><a class="text-link" href="cart.html">← Volver al carrito</a></header><main class="store-shell"><div class="store-heading"><div><p class="eyebrow">CHECKOUT</p><h1>Finaliza tu compra</h1></div></div><div id="checkout-guard"></div><div class="checkout-layout"><form id="checkout-form" class="checkout-form" novalidate><section class="checkout-card"><p class="eyebrow">DATOS DEL CLIENTE</p><h2>¿A dónde enviamos tu pedido?</h2><div class="form-grid"><label>Nombre completo<input id="customer-name" required autocomplete="name"></label><label>Documento<input id="document-number" required autocomplete="off"></label><label>Teléfono<input id="phone" required autocomplete="tel" inputmode="tel"></label><label>Destino / ciudad<input id="destination" required autocomplete="address-level2"></label><label class="form-grid__full">Dirección<input id="address" required autocomplete="street-address"></label><label class="form-grid__full">Información adicional<textarea id="additional-info" rows="4" placeholder="Indicaciones para la entrega (opcional)"></textarea></label></div></section><section class="checkout-card"><p class="eyebrow">PAGO</p><h2>Revisión del comprobante</h2><p class="checkout-note">En esta primera versión el pedido quedará pendiente de pago. Después conectaremos el envío del comprobante y la revisión desde el panel administrativo.</p><button class="button button--primary" id="place-order" type="submit">Crear pedido</button><p id="checkout-status" class="auth-status" role="status" aria-live="polite"></p></section></form><aside id="checkout-summary" class="cart-summary"></aside></div></main><script src="../js/runtime-config.js"></script><script type="module" src="../js/pages/checkout.js"></script></body></html>
