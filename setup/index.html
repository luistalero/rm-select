<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Configuración inicial segura de RM SELECT.">
  <meta name="theme-color" content="#b69a63">
  <title>Configuración inicial | RM SELECT</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/setup.css">
</head>
<body class="setup-page">
  <main class="setup-shell">
    <section class="setup-card" aria-labelledby="setup-title">
      <div class="setup-brand" aria-label="RM SELECT"><span>RM</span><small>SELECT</small></div>
      <p class="eyebrow">CONFIGURACIÓN INICIAL</p>
      <h1 id="setup-title">Crear acceso principal</h1>
      <p class="setup-intro">Este proceso solo puede convertir una cuenta en el único SUPER_ADMIN de RM SELECT. Necesitarás el código privado de activación configurado en Supabase.</p>
      <form id="bootstrap-form" novalidate>
        <label>Nombre completo<input id="full-name" name="fullName" type="text" autocomplete="name" required minlength="3"></label>
        <label>Correo electrónico<input id="email" name="email" type="email" autocomplete="email" required></label>
        <label>Teléfono<input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></label>
        <label>Contraseña<input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></label>
        <label>Código privado de activación<input id="secret" name="secret" type="password" autocomplete="off" required minlength="16"></label>
        <button class="button button--primary setup-submit" type="submit" id="submit-button">Crear SUPER_ADMIN</button>
      </form>
      <div id="setup-status" class="setup-status" role="status" aria-live="polite"></div>
      <a class="setup-back" href="../index.html">← Volver a RM SELECT</a>
    </section>
  </main>
  <script src="../js/runtime-config.js"></script>
  <script type="module" src="../js/pages/setup.js"></script>
</body>
</html>
