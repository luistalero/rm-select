<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Configuración inicial · RM SELECT</title>
  <link rel="stylesheet" href="./setup.css">
</head>
<body>
  <main class="setup-card">
    <div class="brand-mark">RM</div>
    <p class="eyebrow">Configuración inicial</p>
    <h1>Crear SUPER_ADMIN</h1>
    <p class="intro">
      Esta pantalla solo funciona una vez. Necesitas el código privado de activación
      configurado en Supabase.
    </p>

    <form id="setup-form" novalidate>
      <label>
        Nombre completo
        <input id="full-name" name="fullName" autocomplete="name" required minlength="2">
      </label>

      <label>
        Correo electrónico
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>

      <label>
        Contraseña
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
      </label>

      <label>
        Código privado de activación
        <input id="secret" name="secret" type="password" autocomplete="off" required minlength="16">
      </label>

      <button type="submit" id="submit-button">Activar SUPER_ADMIN</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <p class="warning">
      No compartas el código privado. No se guarda en GitHub ni en el navegador.
    </p>
  </main>

  <script src="../js/runtime-config.js"></script>
  <script type="module" src="./setup.js"></script>
</body>
</html>
