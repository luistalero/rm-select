name: Keep Supabase awake

on:
  schedule:
    # GitHub Actions scheduling can be delayed during periods of high load.
    # This is intentionally a lightweight public catalog read.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the public catalog
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          curl --fail --silent --show-error \
            --max-time 20 \
            --retry 2 \
            --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&is_active=eq.true&limit=1" \
            -o /dev/null
